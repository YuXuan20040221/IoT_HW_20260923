name: Update Weather Data

on:
  schedule:
    # 每天固定在台灣時間 02:00, 08:00, 14:00, 20:00 (UTC 18:00, 00:00, 06:00, 12:00) 執行
    - cron: '0 18,0,6,12 * * *'
  workflow_dispatch: # 支援手動在 GitHub Actions 頁面點擊執行

# 賦予寫入權限以便 push 回 repository
permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Weather Data from CWA API
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: node scripts/fetch-weather.js

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "沒有任何資料變更，跳過 commit。"
          else
            git commit -m "chore(data): auto update weather data [skip ci]"
            git push
          fi
